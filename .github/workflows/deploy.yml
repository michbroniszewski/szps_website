name: Deploy to mydevil

# Wywoływane automatycznie po pushu do main oraz ręcznie z zakładki Actions
# (przycisk "Run workflow" — przydatne do pierwszego uruchomienia i testów).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Wgraj wszystkie pliki (zamiast tylko zmienionych)"
        type: boolean
        default: false

# Nie odpalamy równolegle dwóch deployów — kolejny czeka aż poprzedni skończy.
concurrency:
  group: deploy-mydevil
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync files to sedziowie.szps.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # collectstatic uruchamiamy w CI, żeby nie musieć go odpalać na
      # serwerze — od razu wysyłamy gotowe public/static/.
      # Dane bazy nieistotne (collectstatic nie łączy się z DB), ale
      # settings.py wymaga zdefiniowanego SECRET_KEY.
      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: sedziowie.szps.pl
          DB_ENGINE: sqlite
        run: python manage.py collectstatic --noinput --clear

      # Aktualizacja pliku restartu — Passenger wykrywa zmianę mtime i
      # przeładowuje aplikację. Deploy uploaduje ten plik jako ostatni,
      # więc restart dzieje się dopiero gdy reszta jest już na serwerze.
      - name: Refresh restart trigger
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ deploy=${{ github.sha }}" > tmp/restart.txt

      - name: Install lftp
        # `apt-get update` bywa flaky (Google Chrome / inne third-party
        # repo na runnerze potrafią zwrócić Hash Sum mismatch). Traktujemy
        # go jako non-fatal — lftp jest w standardowych repo Ubuntu i
        # zwykle da się zainstalować z indeksu już buforowanego w obrazie
        # runnera. Jeśli faktycznie nie ma pakietu, install padnie
        # z czytelnym komunikatem.
        run: |
          sudo apt-get update -qq || echo "apt-get update returned non-zero, continuing with cached indices"
          sudo apt-get install -y -qq lftp

      # Wysyłamy tylko pliki zmienione od poprzedniego deployu — porównanie
      # sha256 z manifestem `.deploy-manifest` na serwerze (szczegóły
      # w scripts/deploy-ftp.sh). Wcześniej `mirror --transfer-all` wgrywał
      # za każdym razem ~1600 plików / ~100 MB, co trwało ~20 minut.
      # Pełne wgranie: Actions → Deploy to mydevil → Run workflow → „full”.
      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ vars.MYDEVIL_FTP_HOST || 's70.mydevil.net' }}
          FTP_USER: ${{ secrets.MYDEVIL_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.MYDEVIL_FTP_PASSWORD }}
          # Passenger uruchamia aplikację z /public_python (ścieżka widziana
          # z konta FTP), nie z katalogu domeny.
          REMOTE_DIR: /public_python
          FULL_DEPLOY: ${{ inputs.full_deploy && '1' || '0' }}
        run: |
          if [ -z "${FTP_USER}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "ERROR: brak sekretów MYDEVIL_FTP_USER / MYDEVIL_FTP_PASSWORD."
            echo "       user length: ${#FTP_USER}, password length: ${#FTP_PASSWORD}"
            echo "       Dodaj je w Settings → Secrets and variables → Actions."
            exit 1
          fi
          bash scripts/deploy-ftp.sh
