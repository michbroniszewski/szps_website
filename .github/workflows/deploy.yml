name: Deploy to mydevil

# Wywoływane automatycznie po pushu do main oraz ręcznie z zakładki Actions
# (przycisk "Run workflow" — przydatne do pierwszego uruchomienia i testów).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nie odpalamy równolegle dwóch deployów — kolejny czeka aż poprzedni skończy.
concurrency:
  group: deploy-mydevil
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync files to sedziowie.szps.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # collectstatic uruchamiamy w CI, żeby nie musieć go odpalać na
      # serwerze — od razu wysyłamy gotowe public/static/.
      # Dane bazy nieistotne (collectstatic nie łączy się z DB), ale
      # settings.py wymaga zdefiniowanego SECRET_KEY.
      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: sedziowie.szps.pl
          DB_ENGINE: sqlite
        run: python manage.py collectstatic --noinput --clear

      # Aktualizacja pliku restartu — Passenger wykrywa zmianę mtime i
      # przeładowuje aplikację. Deploy uploaduje ten plik jako ostatni,
      # więc restart dzieje się dopiero gdy reszta jest już na serwerze.
      - name: Refresh restart trigger
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ deploy=${{ github.sha }}" > tmp/restart.txt

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Poświadczenia przez `-u user,pass`, skrypt lftp przez
      # `-e "source ..."`. Nie ma konfliktu z URL (błąd „conflict with
      # other `open' options" dotyczy tylko `-c/-f/-v/-h`). Skrypt
      # zawiera same komendy — open dzieje się automatycznie przez URL
      # z argumentu.
      #
      # Sanity-check przed uruchomieniem — łapie sytuację, gdy sekret
      # nie został dodany albo dodany pod inną nazwą (długość zamiast
      # samej wartości, więc secret nie wycieka do logu).
      - name: Deploy via FTPS
        env:
          MYDEVIL_FTP_HOST: ${{ vars.MYDEVIL_FTP_HOST || 's70.mydevil.net' }}
          MYDEVIL_FTP_USER: ${{ secrets.MYDEVIL_FTP_USER }}
          MYDEVIL_FTP_PASSWORD: ${{ secrets.MYDEVIL_FTP_PASSWORD }}
          REMOTE_DIR: /domains/sedziowie.szps.pl/public_python
        run: |
          if [ -z "${MYDEVIL_FTP_USER}" ] || [ -z "${MYDEVIL_FTP_PASSWORD}" ]; then
            echo "ERROR: brak sekretów MYDEVIL_FTP_USER / MYDEVIL_FTP_PASSWORD."
            echo "       user length: ${#MYDEVIL_FTP_USER}, password length: ${#MYDEVIL_FTP_PASSWORD}"
            echo "       Dodaj je w Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Credentials present: host=${MYDEVIL_FTP_HOST}, user=${#MYDEVIL_FTP_USER}ch, password=${#MYDEVIL_FTP_PASSWORD}ch"

          # Skrypt lftp — kluczowe ustawienia:
          # * debug 3          — pełny log FTP (wire-level), potrzebny do
          #                     diagnostyki gdy mirror milknie
          # * cmd:fail-exit no — nie przerywaj skryptu na pierwszym błędzie
          #                     (ProFTPD mydevila zwraca 550 na MKD dla
          #                     istniejącego katalogu; mirror by abortował)
          # * --transfer-all   — wgraj każdy plik niezależnie od
          #                     porównania size/mtime; git checkout resetuje
          #                     mtime, więc porównanie i tak jest bezużyteczne
          # * `cd REMOTE_DIR`  — pracujemy relatywnie do docelowego
          #                     katalogu, żeby ścieżki w logach były
          #                     czytelne
          # * `tmp/restart.txt` osobnym `put` na końcu — Passenger widzi
          #     zmianę mtime dopiero gdy reszta plików jest już wgrana.
          cat > /tmp/deploy.lftp <<'LFTP_SCRIPT'
          debug 3
          set cmd:fail-exit no
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-allow yes
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 2
          echo "=== cd to remote dir ==="
          cd __REMOTE_DIR__
          pwd
          echo "=== starting mirror ==="
          mirror --reverse --verbose --transfer-all --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .venv/ --exclude-glob venv/ --exclude-glob __pycache__/ --exclude-glob '*.pyc' --exclude-glob db.sqlite3 --exclude-glob db.sqlite3-journal --exclude-glob .env --exclude-glob '.env.*' --exclude public/media/ --exclude-glob tmp/ --exclude-glob uploads/ --exclude-glob screenshots/ --exclude-glob z_orig.png --exclude-glob .thumbnail --exclude-glob node_modules/ --exclude-glob docs/ --exclude-glob .DS_Store --exclude-glob .ftp-deploy-sync-state.json ./ .
          echo "=== mirror done, uploading restart trigger ==="
          put tmp/restart.txt -o tmp/restart.txt
          echo "=== all done ==="
          bye
          LFTP_SCRIPT
          sed -i "s|__REMOTE_DIR__|${REMOTE_DIR}|g" /tmp/deploy.lftp

          echo "--- lftp script ---"
          cat /tmp/deploy.lftp
          echo "--- running lftp ---"
          lftp -u "${MYDEVIL_FTP_USER},${MYDEVIL_FTP_PASSWORD}" \
               -e "source /tmp/deploy.lftp" \
               "ftp://${MYDEVIL_FTP_HOST}"
