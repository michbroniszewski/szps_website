name: Deploy to mydevil

# Wywoływane automatycznie po pushu do main oraz ręcznie z zakładki Actions
# (przycisk "Run workflow" — przydatne do pierwszego uruchomienia i testów).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nie odpalamy równolegle dwóch deployów — kolejny czeka aż poprzedni skończy.
concurrency:
  group: deploy-mydevil
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync files to sedziowie.szps.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # collectstatic uruchamiamy w CI, żeby nie musieć go odpalać na
      # serwerze — od razu wysyłamy gotowe public/static/.
      # Dane bazy nieistotne (collectstatic nie łączy się z DB), ale
      # settings.py wymaga zdefiniowanego SECRET_KEY.
      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: sedziowie.szps.pl
          DB_ENGINE: sqlite
        run: python manage.py collectstatic --noinput --clear

      # Aktualizacja pliku restartu — Passenger wykrywa zmianę mtime i
      # przeładowuje aplikację. Deploy uploaduje ten plik jako ostatni,
      # więc restart dzieje się dopiero gdy reszta jest już na serwerze.
      - name: Refresh restart trigger
        run: |
          mkdir -p tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ deploy=${{ github.sha }}" > tmp/restart.txt

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp mirror zamiast SamKirkland/basic-ftp — basic-ftp gubi się
      # na kanale danych TLS mydevila (`SSL alert 50`), lftp działa OK.
      #
      # Skrypt lftp jest zapisywany do pliku przez quoted heredoc
      # (żadnych rozwinięć shellowych w środku), a REMOTE_DIR wstawiamy
      # przez sed. Poświadczenia i host lecą jako argumenty CLI, więc
      # nie ma ryzyka błędnego cytowania hasła.
      - name: Deploy via FTPS
        env:
          MYDEVIL_FTP_HOST: ${{ vars.MYDEVIL_FTP_HOST || 's70.mydevil.net' }}
          MYDEVIL_FTP_USER: ${{ secrets.MYDEVIL_FTP_USER }}
          MYDEVIL_FTP_PASSWORD: ${{ secrets.MYDEVIL_FTP_PASSWORD }}
          REMOTE_DIR: /domains/sedziowie.szps.pl/public_python
        run: |
          cat > /tmp/deploy.lftp <<'LFTP_SCRIPT'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-allow yes
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --only-newer --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .venv/ --exclude-glob venv/ --exclude-glob __pycache__/ --exclude-glob '*.pyc' --exclude-glob db.sqlite3 --exclude-glob db.sqlite3-journal --exclude-glob .env --exclude-glob '.env.*' --exclude public/media/ --exclude-glob uploads/ --exclude-glob screenshots/ --exclude-glob z_orig.png --exclude-glob .thumbnail --exclude-glob node_modules/ --exclude-glob docs/ --exclude-glob .DS_Store --exclude-glob .ftp-deploy-sync-state.json ./ __REMOTE_DIR__/
          bye
          LFTP_SCRIPT
          sed -i "s|__REMOTE_DIR__|${REMOTE_DIR}|g" /tmp/deploy.lftp
          echo "--- lftp script ---"
          cat /tmp/deploy.lftp
          echo "--- running lftp ---"
          lftp -u "${MYDEVIL_FTP_USER},${MYDEVIL_FTP_PASSWORD}" -f /tmp/deploy.lftp "ftp://${MYDEVIL_FTP_HOST}"
