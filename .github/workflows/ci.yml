name: CI

# Bramka jakości przed merge do main i przed deployem.
# Odpala się na każdy push i pull request; deploy.yml jest niezależny
# (leci na main), ale w praktyce PR-y powinny być zielone przed merge.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Django check + migrations + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Wspólne zmienne dla wszystkich kroków Django. SQLite w pamięci —
      # testy nie potrzebują PostgreSQL, a settings.py sam wybiera SQLite,
      # gdy DB_ENGINE != "postgresql".
      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: testserver
          DB_ENGINE: sqlite
        run: python manage.py check

      # Wychwytuje sytuację, gdy ktoś zmienił model bez odpalenia
      # `makemigrations` — deploy taką zmianę wpuściłby na produkcję.
      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: testserver
          DB_ENGINE: sqlite
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: testserver
          DB_ENGINE: sqlite
          # Test client jedzie po http://testserver → wyłączamy SSL redirect,
          # żeby widoki zwracały 200/404 zamiast 301 na HTTPS.
          DJANGO_SECURE_SSL_REDIRECT: "False"
        run: python manage.py test --verbosity 2

      # Sanity-check dla static files — collectstatic to jedyny etap
      # deploy.yml, który wcześniej łapał błędy w templatkach/staticach.
      - name: Collect static files (sanity check)
        env:
          DJANGO_SECRET_KEY: ci-only-not-used-at-runtime
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: testserver
          DB_ENGINE: sqlite
        run: python manage.py collectstatic --noinput --clear
